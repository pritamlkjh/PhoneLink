name: PhoneLink CI

on:
  push:
    branches: [ main, dev/** ]
  pull_request:
    branches: [ main ]

jobs:
  protocol-and-vps:
    name: Protocol Schemas & VPS Relay (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Validate Protocol Schemas & Round-Trip
        run: ./tests/test_schema_roundtrip.sh

      - name: Secret Hygiene Scan
        run: ./scripts/scan_secrets.sh

      - name: Run VPS Relay Vet, Tests & Build
        run: |
          cd vps
          go vet ./...
          go test -race -v ./...
          go build -v -o bin/phonelink-relay ./cmd/relay

  mac-client:
    name: Mac Client (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mac Client
        run: |
          cd mac
          swift build

      - name: Run Mac Tests & CLI
        run: |
          cd mac
          swift run PhoneLinkTests
          swift run phonelink --version
          swift run phonelink --help

  android-client:
    name: Android Client (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Run Android Lint & Unit Tests
        run: |
          cd android
          ./gradlew lintDebug testDebugUnitTest --no-daemon

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
