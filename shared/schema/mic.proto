syntax = "proto3";

package phonelink.mic;

import "common.proto";

option go_package = "github.com/pritamlkjh/phonelink/vps/pkg/proto/mic";
option java_package = "com.phonelink.proto.mic";
option java_multiple_files = true;

message MicStartRequest {
  string session_id = 1;
  uint32 sample_rate_hz = 2;     // Target sample rate (8000 to 48000, default 16000)
  uint32 channels = 3;           // Mono = 1
  uint32 chunk_duration_ms = 4;  // Target chunk cadence in ms (default 200)
}

message MicStartResponse {
  string session_id = 1;
  phonelink.common.StatusCode status = 2;
  string error_message = 3;
  uint32 actual_sample_rate_hz = 4;
  uint32 actual_channels = 5;
  uint32 bits_per_sample = 6;
}

message MicStopRequest {
  string session_id = 1;
  string reason = 2;
}

message MicStopResponse {
  string session_id = 1;
  phonelink.common.StatusCode status = 2;
}

// Streamed PCM audio chunk
message MicAudioChunk {
  string session_id = 1;
  uint64 chunk_number = 2;
  int64 timestamp_ms = 3;
  bytes pcm_data = 4;            // Little-endian signed 16-bit PCM bytes
  uint32 sample_rate_hz = 5;
  uint32 channels = 6;
  uint32 bits_per_sample = 7;
}
